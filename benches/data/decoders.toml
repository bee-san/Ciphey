# Decoder benchmark fixtures (used by benches/decoders.rs).
#
# Every decoder gets two inputs: the "medium" plaintext (84 chars) and the "long"
# plaintext (576 chars) encoded with that decoder, encoded by the same crates the
# decoder itself uses (base64, data-encoding, bs58, base91, base65536, z85,
# urlencoding) or by the textbook algorithm for ciphers (ROT13 for caesar, 3 rails
# for railfence, key KEY/LEMON for Vigenere, etc). Base85 (RFC 1924) has no crate, so its
# inputs come from Python's base64.b85encode. Ascii85 is hand-rolled, so its inputs come
# from Python's base64.a85encode(adobe=True). HTML Entities writes every character as a
# decimal (medium) or hexadecimal (long) character reference, like CyberChef's "To HTML
# Entity" with "Convert all characters".
#
#   decoder  = key into ciphey::decoders::DECODER_MAP
#   size     = "medium" | "long"
#   success  = whether Decoder::crack reports success with the Athena checker today
#   expected = one of the strings crack() returns in `unencrypted_text` today
#
# `miss` is shared by all decoders: a fixed gibberish string that is not valid for
# any decoder, which is what most decoders see during a search.
#
# The bench checks every case before measuring, so a decoder behaviour change shows
# up as a panic pointing at the stale case instead of as a silently different number.
# Some `expected` values record current quirks rather than the ideal output (rot47
# returns an upper-cased shift that the English checker accepts first; a1z26 cannot
# encode spaces).

miss = "T00 l3= ox+#G WKyV pajU6j qxH@ %B4+a 5Pn^ 7p_v1q 9sLvu *+36i R5rL&3 mVJZI iO0 Ut8_m COTV"


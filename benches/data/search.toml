# A* search corpus (used by benches/search.rs), run end to end through
# ciphey::perform_cracking with a fixed 1 second timeout.
#
#   kind     = "plaintext" | "single" | "multi" | "no_solution"
#   layers   = encodings applied to the plaintext, innermost first
#              (["caesar", "Base64"] means base64(rot13(plaintext)))
#   expected = the text perform_cracking returns today, checked before measuring.
#   outcome  = no_solution only. How the search ends today:
#                exhausted       Ok(None): every decoder rejects the input
#                false_positive  Ok(Some(..)): it settles on gibberish (usually rot47 -> Vigenere)
#                timeout         Err(Timeout): still searching when the 1 s timer fires
#              Only "exhausted" and "timeout" are checked; where a false positive is
#              found depends on search order, and a slower machine may time out first.

[[case]]
kind = "plaintext"
name = "already_plaintext"
layers = []
input = "Meet me at the old lighthouse after midnight and bring the map, the key and a torch."
expected = "Meet me at the old lighthouse after midnight and bring the map, the key and a torch."


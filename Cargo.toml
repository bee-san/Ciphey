[package]
name = "ciphey"
repository = "https://github.com/bee-san/ciphey"
version = "0.12.1"
edition = "2021"
description = "Automated decoding tool, Ciphey but in Rust"
license = "MIT"
# The end-to-end benchmark (its scripts, corpus and baseline) is for this repository, not the crate
exclude = ["benches/e2e/", "benches/data/e2e/", "fuzz/"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ciphey"
path = "src/lib.rs"
bench = false

[[bin]]
name = "ciphey"
path = "src/main.rs"
bench = false

# MCP (Model Context Protocol) stdio server. Only built with `--features mcp`.
[[bin]]
name = "ciphey-mcp"
path = "src/bin/ciphey-mcp/main.rs"
bench = false
required-features = ["mcp"]

[features]
default = []
# Builds the `ciphey-mcp` binary. Off by default so the `ciphey` CLI and the
# library don't pull in the MCP SDK or an async runtime.
mcp = ["dep:memory-stats", "dep:rmcp", "dep:tokio"]

# Every target, WebAssembly included: see docs/wasm.md before adding one.
# Please keep this list in alphabetical order
[dependencies]
chrono = "0.4.45"
termcolor = "1.4"
gibberish-or-not = "5.0.7"
lazy-regex = "3.6.0"
lazy_static = "1.4.0"
lemmeknow = "0.8.0"
log = "0.4"
# Lets `ciphey-mcp` workers watch their own memory use (feature `mcp`).
memory-stats = { version = "1.2.0", optional = true }
num = "0.4"
once_cell = "1.21.4"
proc-macro2 = "1.0.106" # Required due to https://github.com/rust-lang/rust/issues/113152
regex = "1.12.4"
# Official MCP Rust SDK, only used by `ciphey-mcp` (feature `mcp`). Pinned exactly so
# `cargo install` (which ignores Cargo.lock) builds against the version we tested.
rmcp = { version = "=3.8.0", optional = true, default-features = false, features = ["macros", "server", "transport-io"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_derive = "1.0.197"
serde_json = "1.0"
serial_test = "4.0.1"
thiserror = "2.0.17"
# Async runtime for `ciphey-mcp` (feature `mcp`).
tokio = { version = "1.48.0", optional = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
toml = "1.1.2"
# The search's clock: std::time on native targets, and on wasm32-unknown-unknown the
# browser's (or Node.js's) clock, because std::time::Instant::now() panics there
web-time = "1.1.0"

# Dependencies used for decoding
base64 = "0.23.0"
base65536 = "1.0.1"
base91 = "0.1.0"
bs58 = "0.5.0"
# The default backend, libbz2-rs-sys, is a pure-Rust port of libbzip2: no C toolchain needed
bzip2 = "0.6.1"
data-encoding = "2.11.0"
encoding_rs = "0.8.35"
html-escape = "0.3.0"
flate2 = "1.1.10"
# Only idna::punycode is used. 1.0.3 is the version gibberish-or-not already pulls in.
idna = "1.0.3"
# XZ and .lzma decompression, pure Rust. Only the decoders: no encoder, no lzip, and no
# `optimization` (it turns on unsafe architecture-specific code paths).
lzma-rust2 = { version = "0.21.0", default-features = false, features = ["std", "xz"] }
urlencoding = "2.1.3"
z85 = "3.0.7"
brainfuck-exe = { version = "0.2.4", default-features = false }
dashmap = "6.2.1"

# Native targets only: threads, files, the terminal and the SQLite cache. WebAssembly has
# none of them (docs/wasm.md).
# Please keep this list in alphabetical order
[target.'cfg(not(target_family = "wasm"))'.dependencies]
clap = {version = "4.6.1", features = ["derive"]}
crossbeam = "0.8"
dirs = "7.0.0"
env_logger = "0.11.10"
half = "=2.3.1"  # Required for candle-core compatibility
memmap2 = "0.9.10"
rand = "0.8"  # Required for candle-core compatibility
rayon = "1.12.0"
rusqlite = { version = "0.37", features = ["bundled"] }
text_io = "0.1.13"
# v4 for the IDs of cache and human-rejection rows
uuid = { version = "1.23.3", features = ["v4"] }

# Used to turn on ANSI colour support in the Windows console
[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.9"

# Dev dependencies
[dev-dependencies]
# The XZ decoder's tests build their own .xz and .lzma files (bombs, size limits)
lzma-rust2 = { version = "0.21.0", default-features = false, features = ["std", "xz", "encoder"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
criterion = "0.8.2"

# Runs the tests marked `wasm_bindgen_test` under Node.js:
# `cargo test --target wasm32-unknown-unknown --test wasm` (docs/wasm.md). Pinned exactly
# because the `wasm-bindgen-test-runner` it runs under must be the same version.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "=0.3.80"

[profile.release]
lto = "fat"
panic = "abort"
strip = "symbols"
codegen-units = 1

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"

[[test]]
name = "mcp_stdio"
path = "tests/mcp_stdio.rs"
required-features = ["mcp"]

# Criterion benchmarks, see benches/README.md
[[bench]]
name = "decoders"
harness = false

[[bench]]
name = "checkers"
harness = false

[[bench]]
name = "crib"
harness = false

[[bench]]
name = "search"
harness = false

[[bench]]
name = "startup"
harness = false

# Plaintext-detection accuracy, time per check and end-to-end results, see
# docs/plaintext-detection.md
[[bench]]
name = "plaintext"
harness = false

# Config for 'cargo dist'
[workspace.metadata.dist]
# The preferred cargo-dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.1.0"
# CI backends to support (see 'cargo dist generate-ci')
ci = ["github"]
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]

# JSFuck test vectors for src/decoders/jsfuck_decoder.rs and tests/jsfuck_decoder.rs.
#
# Each `code` is the output of JSFuck.encode(plaintext, wrap, parentScope) from one version
# of jsfuck.js (https://github.com/aemkei/jsfuck), checked with node 22 before it was written
# here: evaluated, it gives `plaintext`. For the wrapped ones (`wrap = true`, jsfuck.com's
# "Eval Source") the source of the function the final call would run is `plaintext`.
#
#   0.4.0     npm jsfuck@0.4.0 (2015): [].filter, unescape, String.fromCharCode, new Date
#   fill      aemkei/jsfuck@03783a8 (2018): [].fill, slice("-1"), [].slice.call, link,
#             Function("return{}")()
#   fill2019  aemkei/jsfuck@31a7ed9 (2019): [].fill, \u escapes in Function('return"..."')()
#   flat      aemkei/jsfuck@3482fa1 (2020): [].flat, [].entries().constructor as Object
#             (as engines had it before Iterator helpers; node 22 was given that back)
#   flat2024  aemkei/jsfuck@a65f433 (2024): [].flat without Object
#   0.5.0     aemkei/jsfuck@6f8fdf3 (2025), byte for byte what https://jsfuck.com/jsfuck.js
#             serves today: [].at, at("-1"), escapes in Function('return"..."')()


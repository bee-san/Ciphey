[package]
name = "ciphey-wasm"
# The version of the ciphey crate it is built with
version = "0.12.1"
edition = "2021"
description = "Ciphey in the browser: JavaScript bindings of the ciphey library for WebAssembly"
license = "MIT"
repository = "https://github.com/bee-san/ciphey"
# Built into a JavaScript package (docs/wasm.md), not published to crates.io
publish = false

[lib]
# cdylib: the .wasm module; rlib: the bindings' native unit tests
crate-type = ["cdylib", "rlib"]

[dependencies]
ciphey = { path = ".." }
# JSON.parse and JSON.stringify: values cross to and from JavaScript as JSON
js-sys = "0.3.107"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
# The same version as the wasm-bindgen CLI that turns the module into a JavaScript package
wasm-bindgen = "=0.2.130"

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "=0.3.80"

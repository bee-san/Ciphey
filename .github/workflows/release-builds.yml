name: Release Builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to build and upload
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      # Upload assets to the release
      contents: write
      # Keyless Sigstore signing of the assets (cosign sign-blob)
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: ciphey
            asset_name: ciphey-linux-x86_64.tar.gz
            archive: tar
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact_name: ciphey
            asset_name: ciphey-macos-x86_64.tar.gz
            archive: tar
          - os: macos-15
            target: aarch64-apple-darwin
            artifact_name: ciphey
            asset_name: ciphey-macos-aarch64.tar.gz
            archive: tar
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact_name: ciphey.exe
            asset_name: ciphey-windows-x86_64.zip
            archive: zip

    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Strip Unix binary
        if: matrix.archive == 'tar'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Package Unix binary
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          tar -C "target/${{ matrix.target }}/release" -czf "${{ matrix.asset_name }}" "${{ matrix.artifact_name }}"
          shasum -a 256 "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"

      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $asset = "${{ matrix.asset_name }}"
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" -DestinationPath $asset
          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLower()
          "$hash  $asset" | Set-Content -NoNewline -Encoding ascii "$asset.sha256"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Keyless signature bound to this workflow's identity. Verify with:
      #   cosign verify-blob --bundle <asset>.sigstore.json \
      #     --certificate-identity-regexp '^https://github.com/bee-san/Ciphey/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com <asset>
      - name: Sign release asset
        shell: bash
        run: cosign sign-blob --yes --bundle "${{ matrix.asset_name }}.sigstore.json" "${{ matrix.asset_name }}"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" "${{ matrix.asset_name }}" "${{ matrix.asset_name }}.sha256" "${{ matrix.asset_name }}.sigstore.json" --clobber

name: Dependabot Auto-merge

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]

# Read-only by default; the merge job asks for the writes it needs.
permissions:
  contents: read

jobs:
  dependabot:
    permissions:
      contents: write
      pull-requests: write
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Merge the tested Dependabot pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          EXPECTED_HEAD: ${{ github.event.workflow_run.head_sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -n "$PR_NUMBER"
          test "$(gh pr view "$PR_NUMBER" --json author --jq '.author.login')" = "dependabot"
          gh pr merge "$PR_NUMBER" --merge --match-head-commit "$EXPECTED_HEAD"

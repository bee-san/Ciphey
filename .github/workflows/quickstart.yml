# Pull requests are tested through the pull_request event; running the same commits again on
# every branch push doubled the work (177 push runs vs 114 PR runs in the 30 days to
# 2026-10-13, 3 OSes each). Superseded runs of the same PR are cancelled.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

name: Test

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege GITHUB_TOKEN: every job only needs to read the repo.
# (Swatinem/rust-cache uses the Actions cache service, which doesn't need extra scopes.)
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Fail the build on any rustc warning so they don't accumulate.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run cargo check
        run: cargo check --all-targets

      - name: Run cargo check (mcp feature)
        run: cargo check --all-targets --features mcp

  bench-build:
    name: Benchmarks build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Builds the benchmarks without running them; they are too slow and noisy for CI.
      # The bench profile inherits fat LTO and one codegen unit from the release profile,
      # which only matters for timing, so this check builds them unoptimised instead.
      - name: Build benchmarks
        run: cargo bench --no-run
        env:
          CARGO_PROFILE_BENCH_OPT_LEVEL: "0"
          CARGO_PROFILE_BENCH_LTO: "false"
          CARGO_PROFILE_BENCH_CODEGEN_UNITS: "256"

  test:
    name: Test Suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # NOTE: this must reference the matrix, otherwise every job runs on Linux
    # and the Windows/macOS entries are no-ops.
    runs-on: ${{ matrix.os }}
    env:
      # The Ubuntu 26.04 image has less free disk: full debug info for every test binary,
      # built twice (with and without `mcp`), filled it on 2026-11-04 ("No space left on
      # device" while linking ciphey-mcp). Line tables keep file:line in panics and backtraces.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run cargo test
        run: cargo test

      # The end-to-end benchmark (benches/README.md): its runner's self-test, then the 10-case
      # smoke subset on the debug ciphey binary cargo test just built, about 3 s. Fails if the
      # runner's parsing or verdict rules break, or a smoke case stops decoding.
      - name: End-to-end benchmark smoke run
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 benches/e2e/run.py --selftest
          python3 benches/e2e/run.py --subset smoke --timeout 20 --check target/debug/ciphey

      - name: Run MCP server tests (mcp feature)
        # The library's tests already ran above; only run the ciphey-mcp unit tests and the
        # JSON-RPC-over-stdio integration test.
        run: cargo test --features mcp --bin ciphey-mcp --test mcp_stdio

  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        # --all-targets also lints tests and benches; -D warnings turns lints into failures.
        run: cargo clippy --all-targets -- -D warnings

      - name: Run cargo clippy (mcp feature)
        run: cargo clippy --all-targets --features mcp -- -D warnings

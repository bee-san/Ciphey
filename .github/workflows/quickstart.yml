on: [push, pull_request]

name: Test

# Least-privilege GITHUB_TOKEN: every job only needs to read the repo.
# (Swatinem/rust-cache uses the Actions cache service, which doesn't need extra scopes.)
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Fail the build on any rustc warning so they don't accumulate.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run cargo check
        run: cargo check --all-targets

      - name: Run cargo check (mcp feature)
        run: cargo check --all-targets --features mcp

  bench-build:
    name: Benchmarks build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # Builds the benchmarks without running them; they are too slow and noisy for CI.
      # The bench profile inherits fat LTO and one codegen unit from the release profile,
      # which only matters for timing, so this check builds them unoptimised instead.
      - name: Build benchmarks
        run: cargo bench --no-run
        env:
          CARGO_PROFILE_BENCH_OPT_LEVEL: "0"
          CARGO_PROFILE_BENCH_LTO: "false"
          CARGO_PROFILE_BENCH_CODEGEN_UNITS: "256"

  test:
    name: Test Suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # NOTE: this must reference the matrix, otherwise every job runs on Linux
    # and the Windows/macOS entries are no-ops.
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run cargo test
        run: cargo test

      - name: Run MCP server tests (mcp feature)
        # The library's tests already ran above; only run the ciphey-mcp unit tests and the
        # JSON-RPC-over-stdio integration test.
        run: cargo test --features mcp --bin ciphey-mcp --test mcp_stdio

  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        # --all-targets also lints tests and benches; -D warnings turns lints into failures.
        run: cargo clippy --all-targets -- -D warnings

      - name: Run cargo clippy (mcp feature)
        run: cargo clippy --all-targets --features mcp -- -D warnings

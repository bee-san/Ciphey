name: Codespell

on:
  pull_request:

permissions:
  contents: read

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install codespell
        run: python -m pip install --require-hashes --no-deps -r .github/codespell-requirements.txt

      - name: Collect changed files
        id: changed-files
        run: |
          git diff --name-only --diff-filter=ACMRT -z "${{ github.event.pull_request.base.sha }}...HEAD" > changed-files.txt
          if [ -s changed-files.txt ]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check spelling in changed files
        if: steps.changed-files.outputs.has_files == 'true'
        run: xargs -0 codespell < changed-files.txt

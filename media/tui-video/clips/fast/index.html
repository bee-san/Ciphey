<!doctype html>
<html lang="en" data-composition-variables='[{"id":"bgDrift","type":"boolean","label":"Drift the background ciphertext","default":true}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Ciphey · Fast</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- Real terminal output, generated from tmux captures by ../capture/ansi_to_json.mjs -->
    <script src="captures.js"></script>
    <!-- Measured timings, generated by ../bench/bench_compare.py -->
    <script src="bench.js"></script>
    <script src="clip-engine.js"></script>
    <link rel="stylesheet" href="clip.css" />
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1920" data-height="1080">
      <div id="bg" class="clip" data-start="0" data-duration="16" data-track-index="0">
        <div id="glyphs" data-layout-allow-overflow data-layout-allow-occlusion></div>
        <div id="vignette"></div>
        <div id="glow"></div>
      </div>

      <section id="title" class="clip" data-start="0" data-duration="2.9" data-track-index="1">
        <div class="center-stack" data-out="2.3">
          <div class="kicker reveal" data-in="0.15">CIPHEY · FAST</div>
          <div class="headline reveal" data-in="0.35">Ciphey is <em>very</em> fast</div>
          <div class="subline reveal" data-in="0.75">a real run<i>·</i>recorded in tmux<i>·</i>timed by bash</div>
        </div>
      </section>

      <section id="stage" class="clip" data-start="2.4" data-duration="9.5" data-track-index="2">
        <div id="winWrap">
          <div id="win">
            <div class="titlebar">
              <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
              <div class="wtitle">bash</div>
            </div>
            <div id="screen" class="screen"></div>
          </div>
        </div>
        <div id="captions"></div>
        <div id="watermark">❯ ciphey · github.com/bee-san/Ciphey</div>
      </section>

      <section id="end" class="clip" data-start="11.6" data-duration="4.4" data-track-index="3">
        <div class="center-stack">
          <div class="kicker reveal" data-in="11.75">SAME INPUT · SAME MACHINE</div>
          <div class="bars">
            <div class="bar-row reveal" data-in="11.95">
              <div class="who">Ciphey<small>Rust, this repo</small></div>
              <div class="track"><div id="fillRust" class="fill rust"></div><div id="valRust" class="val"></div></div>
            </div>
            <div class="bar-row reveal" data-in="12.15">
              <div class="who">Python Ciphey<small id="pyVersion"></small></div>
              <div class="track"><div id="fillPy" class="fill py"></div><div id="valPy" class="val"></div></div>
            </div>
          </div>
          <div id="barsNote" class="bars-note reveal" data-in="12.6"></div>
          <div id="barsNote2" class="bars-note reveal" data-in="13.9"></div>
          <div class="install reveal" data-in="14.2"><b>❯</b> cargo install ciphey</div>
          <div class="link reveal" data-in="14.45">github.com/bee-san/Ciphey</div>
        </div>
      </section>
    </div>

    <script>
      (function () {
        // Real numbers only: the run time comes from the recorded `time` output,
        // the comparison from bench/results.json (via bench.js).
        const term = CipheyClip.captureText("fast");
        const real = Number(/real\s+0m([0-9.]+)s/.exec(term)[1]);
        const B = window.CIPHEY_BENCH;
        const row = B.results.find((r) => r.ciphertext === "NTA3NjYzNzU3MjZjMjA3NjY2MjA2OTcyNjU2YzIwNzM2ZTY2Njc=");
        const rust = row.rust_median_s;
        const pyDnf = row.python_did_not_finish_within_s;
        const py = row.python_median_s;

        document.getElementById("pyVersion").textContent = "v" + B.meta.python_ciphey_version;
        document.getElementById("valRust").textContent = rust.toFixed(2) + " s";
        document.getElementById("valPy").textContent = pyDnf ? `no answer after ${pyDnf} s` : py.toFixed(2) + " s";
        const cpus = /(\d+) logical CPUs/.exec(B.meta.machine)[1];
        document.getElementById("barsNote").textContent =
          `Wall-clock median of ${B.meta.rust_runs_per_input} runs (Python: ${B.meta.python_runs_per_input}) on a shared ${cpus}-CPU Linux machine · media/tui-video/bench`;
        const b64 = B.results.find((r) => r.input === "Base64");
        document.getElementById("barsNote2").textContent =
          `Plain Base64: ${b64.rust_median_s.toFixed(2)} s vs ${b64.python_median_s.toFixed(2)} s · every input we timed is in the README`;

        const TRACK = 1022; // px: 1380 bars width - 330 label column - 28 gap
        const scale = pyDnf ? TRACK / pyDnf : TRACK / Math.max(py, rust);
        const wRust = Math.max(14, rust * scale);
        const wPy = pyDnf ? TRACK : Math.max(14, py * scale);

        const clip = CipheyClip.run({
          duration: 16,
          seed: 11,
          window: { in: 2.4, out: 11.25 },
          scenes: [
            {
              id: "fast", start: 2.9, end: 11.6, eyebrow: "THREE LAYERS · NO HINTS",
              frames: [
                { at: 0 },
                { at: 0.45, typing: [[19, 0.055], [Infinity, 0.012]] },
                // Enter lands at ~2.6s; the output appears after the time the run really took.
                { at: 2.6 + real },
              ],
              captions: [
                { at: 0.0, end: 2.75, html: "ROT13, then hex, then Base64. Ciphey isn't told any of that." },
                { at: 2.8, end: 5.75, html: `Back comes the plaintext and the decoder path, in <em>${real.toFixed(2)} s</em>.` },
                { at: 5.75, end: 8.4, html: "<code>-d</code> skips the y/N check, so that's the whole run." },
              ],
              highlights: [
                { text: "Ciphey is very fast", at: 3.05, end: 5.5 },
                { text: "Base64 → Hexadecimal → caesar", at: 3.3, end: 5.5 },
                { text: "real    0m" + /real\s+0m([0-9.]+s)/.exec(term)[1], at: 3.7, end: 8.2 },
              ],
            },
          ],
          extra(tl) {
            tl.fromTo("#fillRust", { width: 0 }, { width: wRust, duration: 0.5, ease: "power2.out" }, 12.3);
            tl.fromTo("#valRust", { x: 0 }, { x: wRust + 18, duration: 0.5, ease: "power2.out" }, 12.3);
            // Python's bar fills first; its label appears once the bar is full (inside it for a
            // "did not finish", after it otherwise) so the text never overlaps a growing bar.
            tl.fromTo("#fillPy", { width: 0 }, { width: wPy, duration: 1.2, ease: "power1.inOut" }, 12.5);
            tl.fromTo("#valPy", { x: pyDnf ? 24 : wPy + 18, opacity: 0 }, { x: pyDnf ? 24 : wPy + 18, opacity: 1, duration: 0.35, ease: "power2.out" }, 13.65);
          },
        });
        clip.ready.then(() => {
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = clip.tl;
          if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
        });
      })();
    </script>
  </body>
</html>
